{
  "schema": "mjtensu.mldb-v2/evaluation-protocol/v1",
  "id": "tile-classifier/tile-shape-recognition-functional-video-v7",
  "status": "sealed",
  "task": "tile-classifier/tile-shape-classification-35-v1",
  "name": "Tile-shape recognition functional video v7",
  "description": "Evaluate the sealed five-video corpus at deterministic 100 ms source-video intervals using the production detector/classifier/semantic pipeline and production three-consecutive stabilizer. v6 adds fixed-classifier-conditioned detector diagnostics for completed-hand, dora, and meld regions: ordered GT tiles are aligned to spatially ordered recognized tiles; substitutions count against both precision and recall, insertions are false positives, and deletions are false negatives. The classifier stack is a fixed trusted semantic probe rather than a comparison factor. Adds explicit per-take CSV summaries for generic Study table projection without ClearML-specific logic in the evaluator.",
  "implementation": {
    "entrypoint": "evaluate",
    "sha256": "88564728de894daefa8804a0c7e55e8792ca768c228eb5cdd03c3b470f003917"
  },
  "parameters": {
    "detector_model": {
      "default": null,
      "description": "Auxiliary detector Model ID. May be a canonical MLDB Model or immutable browser-deployable Runtime Model."
    },
    "red_five_model": {
      "default": null,
      "description": "Auxiliary red-five classifier Runtime Model ID."
    },
    "detector_score_threshold": {
      "default": 0.35,
      "type": "number",
      "minimum": 0.0,
      "maximum": 1.0,
      "description": "Evaluation-only NanoDet score threshold override; production default remains unchanged."
    }
  },
  "model_parameters": {
    "detector": "detector_model",
    "red-five-classifier": "red_five_model"
  },
  "metrics": {
    "frame_semantic_exact_rate": {
      "type": "number",
      "required": true,
      "preference": "higher"
    },
    "completed_hand_exact_rate": {
      "type": "number",
      "required": true,
      "preference": "higher"
    },
    "dora_exact_rate": {
      "type": "number",
      "required": true,
      "preference": "higher"
    },
    "meld_exact_rate": {
      "type": "number",
      "required": true,
      "preference": "higher"
    },
    "eligible_frame_rate": {
      "type": "number",
      "required": true,
      "preference": "higher"
    },
    "take_gt_streak3_rate": {
      "type": "number",
      "required": true,
      "preference": "higher",
      "description": "Fraction of takes that produce three consecutive GT-exact eligible evaluations."
    },
    "take_product_confirmed_rate": {
      "type": "number",
      "required": true,
      "preference": "higher",
      "description": "Fraction of takes for which the production stabilizer reaches confirmed."
    },
    "take_product_confirmed_exact_rate": {
      "type": "number",
      "required": true,
      "preference": "higher",
      "description": "Fraction of takes whose first production confirmation exactly matches GT."
    },
    "completed_hand_detection_semantic_precision": {
      "type": "number",
      "required": true,
      "preference": "higher",
      "description": "Correct ordered hand tiles / (correct + substitutions + insertions)."
    },
    "completed_hand_detection_semantic_recall": {
      "type": "number",
      "required": true,
      "preference": "higher",
      "description": "Correct ordered hand tiles / (correct + substitutions + deletions)."
    },
    "completed_hand_detection_semantic_f1": {
      "type": "number",
      "required": true,
      "preference": "higher",
      "description": "F1 of fixed-classifier-conditioned ordered hand detector semantics."
    },
    "dora_detection_semantic_precision": {
      "type": "number",
      "required": true,
      "preference": "higher",
      "description": "Correct ordered dora tiles / (correct + substitutions + insertions)."
    },
    "dora_detection_semantic_recall": {
      "type": "number",
      "required": true,
      "preference": "higher",
      "description": "Correct ordered dora tiles / (correct + substitutions + deletions)."
    },
    "dora_detection_semantic_f1": {
      "type": "number",
      "required": true,
      "preference": "higher",
      "description": "F1 of fixed-classifier-conditioned ordered dora detector semantics."
    },
    "meld_detection_semantic_precision": {
      "type": "number",
      "required": true,
      "preference": "higher",
      "description": "Correct ordered meld tiles / (correct + substitutions + insertions), using actual detected observations rather than inferred kan expansion."
    },
    "meld_detection_semantic_recall": {
      "type": "number",
      "required": true,
      "preference": "higher",
      "description": "Correct ordered meld tiles / (correct + substitutions + deletions), using actual detected observations rather than inferred kan expansion."
    },
    "meld_detection_semantic_f1": {
      "type": "number",
      "required": true,
      "preference": "higher",
      "description": "F1 of fixed-classifier-conditioned ordered meld detector semantics."
    },
    "all_regions_detection_semantic_f1": {
      "type": "number",
      "required": true,
      "preference": "higher",
      "description": "Micro-aggregated ordered semantic detector F1 across hand, dora, and meld regions."
    }
  },
  "artifacts": {
    "onnx_model": {
