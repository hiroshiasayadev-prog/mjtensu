    },
    "detector_semantic_take_summary": {
      "format": "csv",
      "schema": "mjtensu.recognition/detector-semantic-take-summary/v1",
      "required": true,
      "description": "One row per take and semantic region with detector-semantic P/R/F1, substitutions, insertions, deletions, invalid detections, fallback-order use, and exact-sequence rate.",
      "study_view": "select"
    }
  }
}
