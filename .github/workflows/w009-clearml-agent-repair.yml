name: W009 ClearML Agent Repair

on:
  push:
    branches:
      - mldb-w009-execution

jobs:
  repair-agent:
    runs-on:
      - self-hosted
      - Linux
      - X64

    steps:
      - name: Locate running ClearML agent
        run: |
          set -euo pipefail
          AGENT="$(docker ps --filter 'name=clearml-agent' --format '{{.ID}}' | head -n1)"
          test -n "$AGENT"
          echo "AGENT=$AGENT" >> "$GITHUB_ENV"
          echo "PROJECT=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$AGENT")" >> "$GITHUB_ENV"
          echo "SERVICE=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.service" }}' "$AGENT")" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$AGENT")" >> "$GITHUB_ENV"
          echo "CONFIG_FILES=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.config_files" }}' "$AGENT")" >> "$GITHUB_ENV"
      - name: Download static Docker CLI
        run: |
          set -euo pipefail
          mkdir -p /tmp/w009-docker-cli
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz -o /tmp/w009-docker-cli/docker.tgz
          tar -xzf /tmp/w009-docker-cli/docker.tgz -C /tmp/w009-docker-cli

      - name: Copy static Docker CLI into agent
        run: |
          set -euo pipefail
          docker cp /tmp/w009-docker-cli/docker/docker "$AGENT:/usr/local/bin/docker"
          docker exec "$AGENT" chmod 0755 /usr/local/bin/docker

      - name: Execute static Docker CLI binary
        run: |
          set -euo pipefail
          docker exec "$AGENT" /usr/local/bin/docker --version

      - name: Query daemon with static Docker CLI
        run: |
          set -euo pipefail
          docker exec "$AGENT" /usr/local/bin/docker version >/dev/null

      - name: Install compatible ClearML agent
        run: |
          set -euo pipefail
          docker exec "$AGENT" sh -lc 'python3 -m pip install --upgrade clearml-agent==1.9.3'
          docker exec "$AGENT" python3 -c "import pkg_resources; assert pkg_resources.get_distribution('clearml-agent').version == '1.9.3'"

      - name: Validate Compose ownership metadata
        run: |
          set -euo pipefail
          test -n "$PROJECT"
          test -n "$SERVICE"
          test -d "$PROJECT_DIR"
          test -n "$CONFIG_FILES"
      - name: Commit repaired agent image
        run: |
          set -euo pipefail
          docker commit "$AGENT" mldb-clearml-agent:w009 >/dev/null

      - name: Write Compose override
        run: |
          set -euo pipefail
          cat > "$PROJECT_DIR/docker-compose.w009-agent.yml" <<EOF
          services:
            $SERVICE:
              image: mldb-clearml-agent:w009
          EOF

      - name: Recreate ClearML agent from repaired image
        run: |
          set -euo pipefail
          IFS=',' read -ra FILES <<< "$CONFIG_FILES"
          ARGS=()
          for f in "${FILES[@]}"; do ARGS+=( -f "$f" ); done
          docker compose -p "$PROJECT" "${ARGS[@]}" -f "$PROJECT_DIR/docker-compose.w009-agent.yml" up -d "$SERVICE"
      - name: Verify recreated ClearML agent runtime
        run: |
          set -euo pipefail
          sleep 5
          NEW="$(docker ps --filter "label=com.docker.compose.project=$PROJECT" --filter "label=com.docker.compose.service=$SERVICE" --format '{{.ID}}' | head -n1)"
          test -n "$NEW"
          docker exec "$NEW" /usr/local/bin/docker version >/dev/null
          docker exec "$NEW" python3 -c "import pkg_resources; assert pkg_resources.get_distribution('clearml-agent').version == '1.9.3'"
