name: W009 ClearML Agent Repair

on:
  push:
    branches:
      - mldb-w009-execution

jobs:
  repair-agent:
    runs-on:
      - self-hosted
      - Linux
      - X64

    steps:
      - name: Discover ClearML Compose service
        run: |
          set -euo pipefail
          AGENT="$(docker ps -a --filter 'name=clearml-agent' --format '{{.ID}}' | head -n1)"
          test -n "$AGENT"
          echo "AGENT=$AGENT" >> "$GITHUB_ENV"
          echo "BASE_IMAGE=$(docker inspect -f '{{.Config.Image}}' "$AGENT")" >> "$GITHUB_ENV"
          echo "PROJECT=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$AGENT")" >> "$GITHUB_ENV"
          echo "SERVICE=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.service" }}' "$AGENT")" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$AGENT")" >> "$GITHUB_ENV"
          echo "CONFIG_FILES=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.config_files" }}' "$AGENT")" >> "$GITHUB_ENV"
      - name: Prepare repaired agent build context
        run: |
          set -euo pipefail
          BUILD_DIR="$PROJECT_DIR/.w009-agent-build"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          docker pull docker:27.5.1-cli >/dev/null
          CLI_SOURCE="$(docker create docker:27.5.1-cli)"
          docker cp "$CLI_SOURCE:/usr/local/bin/docker" "$BUILD_DIR/docker"
          docker rm "$CLI_SOURCE" >/dev/null
          chmod 0755 "$BUILD_DIR/docker"
          cat > "$BUILD_DIR/Dockerfile" <<'EOF'
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          COPY docker /usr/local/bin/docker
          RUN chmod 0755 /usr/local/bin/docker \
              && python3 -m pip install --upgrade clearml-agent==1.9.3
          EOF

      - name: Build repaired ClearML agent image
        run: |
          set -euo pipefail
          docker build --build-arg BASE_IMAGE="$BASE_IMAGE" -t mldb-clearml-agent:w009 "$PROJECT_DIR/.w009-agent-build"
      - name: Verify repaired image contents
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /usr/local/bin/docker mldb-clearml-agent:w009 --version
          docker run --rm --entrypoint python3 mldb-clearml-agent:w009 -c "import pkg_resources; assert pkg_resources.get_distribution('clearml-agent').version == '1.9.3'"

      - name: Write Compose override
        run: |
          set -euo pipefail
          cat > "$PROJECT_DIR/docker-compose.w009-agent.yml" <<'EOF'
          services:
            PLACEHOLDER_SERVICE:
              image: mldb-clearml-agent:w009
              restart: unless-stopped
              volumes:
                - /tmp:/tmp
              environment:
                MINIO_ROOT_USER: ${MINIO_ROOT_USER}
                MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
          EOF
          sed -i "s/PLACEHOLDER_SERVICE/$SERVICE/" "$PROJECT_DIR/docker-compose.w009-agent.yml"

      - name: Recreate ClearML agent with object-store credentials
        run: |
          set -euo pipefail
          OBJECTSTORE="$(docker ps --filter 'name=mldb-objectstore' --format '{{.ID}}' | head -n1)"
          test -n "$OBJECTSTORE"
          export MINIO_ROOT_USER="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$OBJECTSTORE" | sed -n 's/^MINIO_ROOT_USER=//p' | head -n1)"
          export MINIO_ROOT_PASSWORD="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$OBJECTSTORE" | sed -n 's/^MINIO_ROOT_PASSWORD=//p' | head -n1)"
          test -n "$MINIO_ROOT_USER"
          test -n "$MINIO_ROOT_PASSWORD"
          echo "::add-mask::$MINIO_ROOT_USER"
          echo "::add-mask::$MINIO_ROOT_PASSWORD"
          IFS=',' read -ra FILES <<< "$CONFIG_FILES"
          ARGS=()
          for f in "${FILES[@]}"; do ARGS+=( -f "$f" ); done
          docker compose -p "$PROJECT" "${ARGS[@]}" -f "$PROJECT_DIR/docker-compose.w009-agent.yml" up -d "$SERVICE"
          unset MINIO_ROOT_USER MINIO_ROOT_PASSWORD

      - name: Verify recreated agent runtime
        run: |
          set -euo pipefail
          sleep 5
          NEW="$(docker ps -a --filter "label=com.docker.compose.project=$PROJECT" --filter "label=com.docker.compose.service=$SERVICE" --format '{{.ID}}' | head -n1)"
          test -n "$NEW"
          STATE="$(docker inspect -f '{{.State.Status}}' "$NEW")"
          EXIT_CODE="$(docker inspect -f '{{.State.ExitCode}}' "$NEW")"
          OOM="$(docker inspect -f '{{.State.OOMKilled}}' "$NEW")"
          RESTARTS="$(docker inspect -f '{{.RestartCount}}' "$NEW")"
          ENTRYPOINT="$(docker inspect -f '{{json .Config.Entrypoint}}' "$NEW")"
          CMD="$(docker inspect -f '{{json .Config.Cmd}}' "$NEW")"
          echo "agent_state=$STATE exit_code=$EXIT_CODE oom=$OOM restarts=$RESTARTS"
          if [ "$STATE" != "running" ]; then
            echo "::error title=ClearML worker state::state=$STATE exit=$EXIT_CODE oom=$OOM restarts=$RESTARTS"
            echo "::error title=ClearML worker command::entrypoint=$ENTRYPOINT cmd=$CMD"
            ERR="$(docker logs --tail 100 "$NEW" 2>&1 | grep -Ei 'error|exception|traceback|usage:|unrecognized|no such|not found|failed|missing|credential|config' | tail -n 8 | tr '\n' ' ' | sed -E 's/([A-Za-z_]*(SECRET|PASSWORD|TOKEN|ACCESS_KEY)[A-Za-z_]*=)[^ ]+/\1[REDACTED]/Ig' | cut -c1-800 || true)"
            if [ -n "$ERR" ]; then
              echo "::error title=ClearML worker log::$ERR"
            fi
            exit 1
          fi
          docker exec "$NEW" /usr/local/bin/docker version >/dev/null
          docker exec "$NEW" python3 -c "import pkg_resources; assert pkg_resources.get_distribution('clearml-agent').version == '1.9.3'"

      - name: Verify GPU container runtime
        run: |
          set -euo pipefail
          docker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi >/dev/null

      - name: Verify worker stays online and has storage credentials
        run: |
          set -euo pipefail
          sleep 15
          NEW="$(docker ps -a --filter "label=com.docker.compose.project=$PROJECT" --filter "label=com.docker.compose.service=$SERVICE" --format '{{.ID}}' | head -n1)"
          test -n "$NEW"
          STATE="$(docker inspect -f '{{.State.Status}}' "$NEW")"
          EXIT_CODE="$(docker inspect -f '{{.State.ExitCode}}' "$NEW")"
          OOM="$(docker inspect -f '{{.State.OOMKilled}}' "$NEW")"
          RESTARTS="$(docker inspect -f '{{.RestartCount}}' "$NEW")"
          ENTRYPOINT="$(docker inspect -f '{{json .Config.Entrypoint}}' "$NEW")"
          CMD="$(docker inspect -f '{{json .Config.Cmd}}' "$NEW")"
          echo "agent_state=$STATE exit_code=$EXIT_CODE oom=$OOM restarts=$RESTARTS"
          if [ "$STATE" != "running" ]; then
            echo "::error title=ClearML worker state::state=$STATE exit=$EXIT_CODE oom=$OOM restarts=$RESTARTS"
            echo "::error title=ClearML worker command::entrypoint=$ENTRYPOINT cmd=$CMD"
            ERR="$(docker logs --tail 100 "$NEW" 2>&1 | grep -Ei 'error|exception|traceback|usage:|unrecognized|no such|not found|failed|missing|credential|config' | tail -n 8 | tr '\n' ' ' | sed -E 's/([A-Za-z_]*(SECRET|PASSWORD|TOKEN|ACCESS_KEY)[A-Za-z_]*=)[^ ]+/\1[REDACTED]/Ig' | cut -c1-800 || true)"
            if [ -n "$ERR" ]; then
              echo "::error title=ClearML worker log::$ERR"
            fi
            exit 1
          fi
          docker exec "$NEW" sh -lc 'test -n "$MINIO_ROOT_USER" && test -n "$MINIO_ROOT_PASSWORD"'
