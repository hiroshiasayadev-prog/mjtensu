  "task": "tile-classifier/tile-shape-classification-35-v1",
  "name": "Production recognition iPhone latency v2",
  "description": "Replay the sealed five-video iPhone 13 corpus at normal speed on the physical iPhone and measure only production recognition pipeline timing/cadence. Ground-truth comparison, semantic stabilization, prediction tracing, and visualization are intentionally excluded so diagnostic work cannot perturb the latency measurement. The base classifier is the primary MLDB Model; detector and red-five classifier are selected independently by Model ID. v2 exposes every production timing component captured per evaluation, plus total/unattributed overhead and candidate-count distributions, as formal MLDB metrics.",
  "implementation": {
    "entrypoint": "evaluate",
    "sha256": "3230bb495fddd44972eb1e0fe701677fa9009af4053a6b3097ad633505e52ba3"
  },
  "parameters": {
    "detector_model": {
      "default": null,
      "description": "Auxiliary detector Model ID. Must resolve to a browser-deployable detector Runtime Model for this classifier-primary protocol."
    },
    "red_five_model": {
      "default": null,
      "description": "Auxiliary red-five classifier Runtime Model ID."
    }
  },
  "model_parameters": {
    "detector": "detector_model",
    "red-five-classifier": "red_five_model"
  },
