  "description": "Native NanoDet Plus training from the official pretrained M320 checkpoint on the Blender final-delivery-v4-ceiling1p8m product-layout synthetic corpus plus repeated annotated real iPhone composites. A fixed source_budget is divided between synthetic and corrected jp_v2 by jp_fraction, while real_repeat is fixed, so source-mix comparisons keep per-epoch sample/update budget constant. Native validation/model selection uses the held-out synthetic validation split; layout-001/layout-002 remain untouched for external real-pathology evaluation. Telemetry preserves native train-loss and validation metric semantics from the corrected-COCO native protocol.",
