{
  "schema": "mjtensu.mldb-v2/evaluation-protocol/v1",
  "id": "nanodet/bbox-pathology-v1",
  "status": "sealed",
  "task": "nanodet/mahjong-tile-detection-v1",
  "name": "NanoDet bounding-box pathology evaluation",
  "description": "Evaluate NanoDet-style raw head outputs on frozen 320x320 application composites. Preserve ordinary IoU=0.5 precision/recall/F1 while separately measuring one-GT-to-many-prediction duplicates, one-prediction-to-many-GT merged boxes, unrelated predictions, misses, and positive prediction-count deltas before and after the production duplicate suppressor.",
  "implementation": {
    "entrypoint": "evaluate",
    "sha256": "70674f4c1b57aeef707d24c8f1b30674d435a990d96dec62bdbaeeec3fedc523"
  },
  "parameters": {
    "split": {
      "default": "val",
      "type": "string"
    },
    "batch_size": {
      "default": 32,
      "type": "integer",
      "minimum": 1
    },
    "workers": {
      "default": 4,
      "type": "integer",
      "minimum": 0
    },
    "score_threshold": {
      "default": 0.35,
      "type": "number",
      "minimum": 0.0,
      "maximum": 1.0
    },
    "nms_iou_threshold": {
      "default": 0.6,
      "type": "number",
      "minimum": 0.0,
      "maximum": 1.0
    },
    "max_detections": {
      "default": 200,
      "type": "integer",
      "minimum": 1
    },
    "pathology_overlap_threshold": {
      "default": 0.25,
      "type": "number",
      "minimum": 0.0,
      "maximum": 1.0
    },
    "duplicate_overlap_threshold": {
      "default": 0.8,
      "type": "number",
      "minimum": 0.0,
      "maximum": 1.0
    },
    "worst_count": {
      "default": 16,
      "type": "integer",
      "minimum": 1,
      "maximum": 64
    }
  },
