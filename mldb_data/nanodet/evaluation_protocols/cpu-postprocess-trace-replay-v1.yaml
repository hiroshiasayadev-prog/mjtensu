  "task": "nanodet/mahjong-tile-detection-v1",
  "name": "NanoDet six-condition CPU-only fixed-trace postprocess replay",
  "description": "Replay existing jp25 detector+classifier output (already NMS 0.60 and coverage 0.80 filtered) across baseline, 2 stricter coverage gates, 2 stricter hard-NMS gates, and Gaussian Soft-NMS. No model inference. Recompute proxy ordered hand/meld/dora semantic metrics. Product stabilization and meld group structure are not recomputed.",
  "implementation": {
    "entrypoint": "evaluate",
