{
  "schema": "mjtensu.mldb-v2/evaluation-protocol/v1",
  "id": "tile-classifier/tile-shape-onnx-cpu-latency-v3",
  "status": "sealed",
  "task": "tile-classifier/tile-shape-classification-35-v1",
  "name": "Tile shape ONNX Runtime CPU latency v3",
  "description": "Export the loaded 1x64x64 grayscale classifier to ONNX opset 16 and benchmark CPUExecutionProvider inference. Cyclic escnn classifiers are converted to a tensor-only PyTorch graph by exporting the equivariant backbone and replacing GroupPooling with an equivalent channel max whose cyclic group size is derived from the actual GroupPooling input/output widths, so both C8 and C4 models are supported. Tensor-export parity and ONNX Runtime parity are verified before timing. Measurement and telemetry semantics are unchanged from v2: only ONNX Runtime session.run latency is measured; export, parity checks, session creation, and preprocessing are excluded.",
  "implementation": {
    "entrypoint": "evaluate",
    "sha256": "38880c4bcb87147f5303963a52d7c40dad982e2504f00015089a52bc3442b715"
  },
  "parameters": {
    "batch_size": {
      "default": 1,
      "type": "integer",
      "minimum": 1,
      "maximum": 64,
      "description": "ONNX inference batch size."
    },
    "warmup_runs": {
      "default": 25,
      "type": "integer",
      "minimum": 1,
      "maximum": 1000,
      "description": "Untimed warmup session.run calls."
    },
    "measure_runs": {
      "default": 200,
      "type": "integer",
      "minimum": 10,
      "maximum": 10000,
      "description": "Timed session.run calls used for latency metrics."
    },
    "intra_op_threads": {
      "default": 1,
      "type": "integer",
      "minimum": 1,
      "maximum": 128,
      "description": "ONNX Runtime intra-op CPU thread count."
    },
    "inter_op_threads": {
      "default": 1,
      "type": "integer",
      "minimum": 1,
      "maximum": 128,
      "description": "ONNX Runtime inter-op CPU thread count; execution remains sequential."
    }
  },
  "metrics": {
    "latency_p50_ms": {
      "type": "number",
      "required": true,
      "description": "Median measured ONNX Runtime session.run latency in milliseconds.",
      "preference": "lower"
    },
    "latency_p95_ms": {
      "type": "number",
      "required": true,
      "description": "Nearest-rank p95 measured ONNX Runtime session.run latency in milliseconds.",
      "preference": "lower"
    },
    "latency_mean_ms": {
      "type": "number",
      "required": true,
      "description": "Arithmetic mean measured ONNX Runtime session.run latency in milliseconds.",
      "preference": "lower"
    }
  },
  "artifacts": {
    "onnx_model": {
      "format": "onnx",
      "schema": "mjtensu.recognition/tile-shape-onnx-model/v1",
      "required": true,
      "description": "Exact ONNX graph used by the CPU latency benchmark."
    },
    "latency_report": {
      "format": "json",
      "schema": "mjtensu.recognition/tile-onnx-cpu-latency/v2",
      "required": true,
      "description": "Raw timing samples, benchmark environment, export/parity metadata, and summary metrics."
    }
  }
}
