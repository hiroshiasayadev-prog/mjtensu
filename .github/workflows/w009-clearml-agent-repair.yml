name: W009 ClearML Agent Repair

on:
  push:
    branches:
      - mldb-w009-execution

jobs:
  repair-agent:
    runs-on:
      - self-hosted
      - Linux
      - X64

    steps:
      - name: Locate ClearML agent container
        run: |
          set -euo pipefail
          AGENT="$(docker ps --filter 'name=clearml-agent' --format '{{.ID}}' | head -n1)"
          test -n "$AGENT"
          echo "AGENT=$AGENT" >> "$GITHUB_ENV"

      - name: Verify static Docker CLI repair is present
        run: |
          set -euo pipefail
          docker exec "$AGENT" /usr/local/bin/docker --version
          docker exec "$AGENT" /usr/local/bin/docker version >/dev/null
      - name: Upgrade ClearML agent package
        run: |
          set -euo pipefail
          docker exec "$AGENT" sh -lc 'python3 -m pip install --upgrade clearml-agent==3.0.3'

      - name: Verify ClearML agent package metadata
        run: |
          set -euo pipefail
          docker exec "$AGENT" python3 -c "import importlib.metadata as m; assert m.version('clearml-agent') == '3.0.3'"

      - name: Restart ClearML agent container
        run: |
          set -euo pipefail
          docker restart "$AGENT" >/dev/null
          sleep 5
          docker ps --filter "id=$AGENT" --format '{{.Status}}' | grep -q '^Up '

      - name: Verify repaired runtime after restart
        run: |
          set -euo pipefail
          docker exec "$AGENT" /usr/local/bin/docker version >/dev/null
          docker exec "$AGENT" python3 -c "import importlib.metadata as m; assert m.version('clearml-agent') == '3.0.3'"
