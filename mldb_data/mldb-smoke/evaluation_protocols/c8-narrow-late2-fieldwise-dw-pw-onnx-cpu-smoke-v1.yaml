  "description": "NO-TRAINING feasibility smoke for the C8 narrow 4/8/16/32-field topology with both late stages made separable. Stages 1-2 remain normal equivariant convolutions. Stage 3 uses a grouped 8-field -> 8-field equivariant 3x3 (groups=8) followed by an equivariant 1x1 8-field -> 16-field mixer; stage 4 uses grouped 16-field -> 16-field equivariant 3x3 (groups=16) followed by equivariant 1x1 16-field -> 32-field mixing. Export through the tensor-only escnn backbone path, verify Torch/export and ONNX Runtime parity, require both grouped 3x3 Conv nodes to survive ONNX export, and measure CPUExecutionProvider session.run latency. Runtime feasibility only; no accuracy claim.",
