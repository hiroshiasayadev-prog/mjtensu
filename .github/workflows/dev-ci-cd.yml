name: Dev CI/CD

on:
  push:
    branches:
      - develop

jobs:
  ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: product/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy-dev:
    needs: ci
    runs-on:
      - self-hosted
      - Linux
      - X64

    steps:
      - name: Deploy DEV
        run: /srv/bugrat/mjtensu-dev/deploy.sh