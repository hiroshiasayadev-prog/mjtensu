name: W009 ClearML Agent Docker CLI Repair

on:
  push:
    branches:
      - mldb-w009-execution

jobs:
  repair-agent-docker-cli:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Check host Docker
        run: docker version

      - name: Locate ClearML agent container
        run: docker ps --format '{{.Names}} {{.Image}}' | grep -i clearml | grep -i agent

      - name: Copy host Docker CLI into ClearML agent
        run: |
          set -euo pipefail
          agent="$(docker ps --format '{{.Names}} {{.Image}}' | awk 'tolower($0) ~ /clearml/ && tolower($0) ~ /agent/ {print $1; exit}')"
          docker cp "$(command -v docker)" "$agent:/usr/local/bin/docker"
          docker exec "$agent" chmod +x /usr/local/bin/docker

      - name: Execute copied Docker CLI binary
        run: |
          set -euo pipefail
          agent="$(docker ps --format '{{.Names}} {{.Image}}' | awk 'tolower($0) ~ /clearml/ && tolower($0) ~ /agent/ {print $1; exit}')"
          docker exec "$agent" /usr/local/bin/docker --version

      - name: Query daemon with copied Docker CLI
        run: |
          set -euo pipefail
          agent="$(docker ps --format '{{.Names}} {{.Image}}' | awk 'tolower($0) ~ /clearml/ && tolower($0) ~ /agent/ {print $1; exit}')"
          docker exec "$agent" /usr/local/bin/docker version

      - name: Confirm agent PATH selects copied CLI
        run: |
          set -euo pipefail
          agent="$(docker ps --format '{{.Names}} {{.Image}}' | awk 'tolower($0) ~ /clearml/ && tolower($0) ~ /agent/ {print $1; exit}')"
          docker exec "$agent" sh -lc 'test "$(command -v docker)" = /usr/local/bin/docker && docker version'
